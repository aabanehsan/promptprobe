name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke test against the hardened mock
        run: promptprobe run -t mock -m hardened --fail-on low -f md -o reports
      - name: Vulnerable mock should be caught
        run: |
          set +e
          promptprobe run -t mock -m vulnerable --fail-on high -f md -o reports
          test $? -eq 1
      - name: SARIF output is well formed
        run: |
          promptprobe run -t mock -m vulnerable -f sarif -o sarif-out --sarif-artifact promptprobe/config_template.yaml
          python - <<'PY'
          import glob, json
          [path] = glob.glob("sarif-out/*.sarif")
          run = json.load(open(path))["runs"][0]
          assert run["results"], "expected findings against the vulnerable mock"
          assert all(r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] == "promptprobe/config_template.yaml" for r in run["results"])
          print(f"{len(run['results'])} SARIF results, {len(run['tool']['driver']['rules'])} rules")
          PY
