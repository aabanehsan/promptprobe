name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke test against the hardened mock
        run: promptprobe run -t mock -m hardened --fail-on low -f md -o reports
      - name: Vulnerable mock should be caught
        run: |
          set +e
          promptprobe run -t mock -m vulnerable --fail-on high -f md -o reports
          test $? -eq 1
