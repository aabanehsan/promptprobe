[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptprobe"
version = "0.1.0"
description = "Prompt injection testing toolkit for LLM apps: canary-based attacks, leak detection and reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aaban Ehsan" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.25", "pyyaml>=6.0"]
keywords = ["llm", "security", "prompt-injection", "red-team", "ai-security", "owasp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
promptprobe = "promptprobe.cli:main"

[project.urls]
Homepage = "https://github.com/aabanehsan/promptprobe"

[tool.setuptools.packages.find]
include = ["promptprobe*"]

[tool.setuptools.package-data]
promptprobe = ["config_template.yaml", "suites/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
